# Auto-publish XPI to GitHub Releases when a version tag is pushed.
#
# Recommended:
#   1. Bump package.json "version" (e.g. 0.1.1)
#   2. Commit
#   3. git tag v0.1.1 && git push origin v0.1.1
#
# Or: Actions → Release → Run workflow → enter v0.1.1
#     (creates the tag; this workflow then runs on the tag push)
#
# Scaffold (`pnpm run release`) will:
#   - create GitHub Release for the tag
#   - upload .xpi
#   - publish update.json / update-beta.json (floating "release" tag assets)

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.1.1). Must match package.json version with a v prefix."
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Manual entry: only create & push the tag; the tag push re-enters this workflow.
  create-tag:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create and push tag
        run: |
          set -euo pipefail
          TAG="${{ inputs.version }}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "Version must look like v0.1.0, got: $TAG"
            exit 1
          fi
          EXPECTED="${TAG#v}"
          PKG_VER=$(node -p "require('./package.json').version")
          if [[ "$PKG_VER" != "$EXPECTED" ]]; then
            echo "package.json version ($PKG_VER) does not match tag ($TAG)"
            echo "Bump package.json first, commit, then re-run."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag -a "$TAG" -m "Release $TAG"
          fi
          git push origin "$TAG"

  release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # Must match package.json "packageManager"
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve package version
        id: package
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build XPI
        run: pnpm run build

      - name: Publish GitHub Release
        run: pnpm run release

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: bamboo-v${{ steps.package.outputs.version }}.xpi
          path: .scaffold/build/bamboo-v${{ steps.package.outputs.version }}.xpi
          if-no-files-found: error

      - name: Comment on linked issues/PRs
        uses: apexskier/github-release-commenter@v1
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          comment-template: |
            :rocket: Fixed in **{release_tag}**. See {release_link} for the release notes and XPI.
